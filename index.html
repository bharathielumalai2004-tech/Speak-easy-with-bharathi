let used=[];let current=0;let score=0;
function getNextIndex(){if(used.length>=quiz.length){alert("🎉 Super Bharathi! 100 words mudinjiduchu!");used=[];}let r;do{r=Math.floor(Math.random()*quiz.length);}while(used.includes(r));used.push(r);return r;}
function loadQ(){current=getNextIndex();document.getElementById('tamil').innerText=quiz[current].ta+" English enna?";document.getElementById('voiceWord').innerText=quiz[current].en;document.getElementById('left').innerText=(quiz.length-used.length);let optDiv=document.getElementById('options');optDiv.innerHTML="";quiz[current].opts.forEach((o,i)=>{let btn=document.createElement('button');btn.className='opt';btn.innerText=String.fromCharCode(65+i)+") "+o;btn.onclick=()=>checkAns(i);optDiv.appendChild(btn);});document.getElementById('result').innerText="";document.getElementById('voiceRes').innerText="";}
function checkAns(ans){let r=document.getElementById('result');if(ans===quiz[current].a){r.innerText="✅ Super! Correct!";r.style.color="green";score++;document.getElementById('score').innerText=score;speakWord();}else{r.innerText="❌ Thappu! Correct: "+quiz[current].opts[quiz[current].a];r.style.color="red";}}
function nextQ(){loadQ();}
function speakWord(){let utter=new SpeechSynthesisUtterance(quiz[current].en);utter.lang='en-US';utter.rate=0.8;speechSynthesis.speak(utter);}
function startVoice(){let vRes=document.getElementById('voiceRes');if(!('webkitSpeechRecognition' in window)){vRes.innerText="Mic support illa";return;}let rec=new webkitSpeechRecognition();rec.lang='en-US';rec.start();vRes.innerText="🎧 Kettukittu irukken...";rec.onresult=function(e){let said=e.results[0][0].transcript.toLowerCase();let target=quiz[current].en.toLowerCase();if(said.includes(target.split(' ')[0])){vRes.innerText="🔥 Excellent! Correct!";}else{vRes.innerText="🗣️ Sonna: '"+e.results[0][0].transcript+"'";}}}
